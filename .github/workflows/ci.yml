name: CI

# This workflow IS the grader. A bounty on this repository pays when its pull
# request merges, and the merge is gated on this run — so a check that passes
# work nobody verified is a check that spends real money on it.
#
# Keep it strict, keep it fast, and never add `-DskipTests`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # `verify`, not `package`: package would build the jar and skip the
      # tests, which is the whole difference between a grader and a compiler.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: HandselViz
          path: target/HandselViz-*.jar
          if-no-files-found: error
