name: LedgermindViz
version: ${project.version}
main: com.ledgermind.viz.LedgermindVizPlugin
api-version: '1.21'
author: Ledgermind
description: A live job board + agent village driven by the real Ledgermind agent-economy API (testnet).
commands:
  lm:
    description: Ledgermind visualization controls
    usage: "/lm <board|village|rig|mine|wallet|top|jobs|on|off|status|reload|clear>"
    permission: ledgermind.admin
permissions:
  ledgermind.admin:
    description: Manage the Ledgermind visualization
    default: op
