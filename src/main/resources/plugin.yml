name: HandselViz
version: ${project.version}
main: com.handsel.viz.HandselVizPlugin
api-version: '1.21'
author: Handsel
description: A live job board + agent village driven by the real Handsel agent-economy API (testnet).
commands:
  lm:
    description: Handsel visualization controls
    usage: "/lm help — 전체 명령 보기"
    permission: handsel.use
permissions:
  handsel.use:
    description: Look at the live economy and work a job (everyone)
    default: true
  handsel.admin:
    description: Place the board/village/rig and control mining
    default: op
