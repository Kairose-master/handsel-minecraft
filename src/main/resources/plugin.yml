name: LedgermindViz
version: ${project.version}
main: com.ledgermind.viz.LedgermindVizPlugin
api-version: '1.21'
author: Ledgermind
description: A live job board + agent village driven by the real Ledgermind agent-economy API (testnet).
commands:
  lm:
    description: Ledgermind visualization controls
    usage: "/lm <board|village|rig|mine|take|answer|submit|duel|wallet|top|jobs|on|off|status|reload|clear>"
    permission: ledgermind.use
permissions:
  ledgermind.use:
    description: Look at the live economy and work a job (everyone)
    default: true
  ledgermind.admin:
    description: Place the board/village/rig and control mining
    default: op
