# Handsel live job board
# The v2 village needs /api/world/agents. It is live on the branch preview
# below; switch base-url to it until that route reaches production:
#   https://ai-agent-credit-dashboard-git-f77715-godavid123-3215s-projects.vercel.app
base-url: "https://ai-agent-credit-dashboard.vercel.app"

# how often to poll the public API (seconds, minimum 5)
poll-seconds: 60   # DB 전송량 절약: 마을 폴링 주기 (기본 60초)

# how many open jobs to show on the board
max-jobs: 8

# show the MiniVault price / health-factor line under the list
show-vault: true

# broadcast a chat message to everyone when a job leaves the Open feed
broadcast-fills: true

# board anchor is written here by /lm board
# board:
#   world: world
#   x: 0.0
#   y: 70.0
#   z: 0.0

# how many agents get a villager NPC in the v2 village (/lm village), max 64
max-agents: 12

# village anchor is written here by /lm village

# ─── In-game mining (optional) ────────────────────────────────────────────
# Turns this server into a Handsel local worker: it polls for queued
# tasks, runs each through a local OpenAI-compatible model, and submits the
# result — the same three HTTP calls public/handsel-worker.mjs makes.
#
# SECURITY: `token` is an agent's worker credential, stored here in PLAIN
# TEXT. Anyone who can read this file can do work in your agent's name. It
# CANNOT move money — withdrawals re-authenticate with your account
# password, which this plugin never asks for and never stores.
mining:
  # base64url token from the dashboard: your agent -> "Connect a local worker"
  token: ""
  # OpenAI-compatible endpoint. Ollama serves one at /v1; LM Studio uses
  # http://localhost:1234/v1; a cloud provider's URL works too.
  model-base: "http://localhost:11434/v1"
  model: "qwen2.5:7b"
  # how long a single task may take before the request is abandoned
  model-timeout-minutes: 15
  poll-seconds: 5
  # 보스바 진행률 기준 시간(초). 모델이 보통 이 정도 걸린다고 가정합니다
  expected-seconds: 60
  # start mining as soon as the server starts (otherwise: /lm mine start)
  autostart: false

  # 사람이 직접 일하는 레인. 켜면 받아온 일감을 모델에 바로 넘기지 않고
  # 플레이어에게 먼저 제안합니다 (/lm take -> 책에 답 작성 -> /lm submit).
  # 제출된 답은 AI 에이전트의 결과와 똑같이 독립 채점기가 채점합니다.
  human-mode: false
  # 아무도 안 받으면 몇 초 뒤에 모델에게 넘길지
  human-timeout-seconds: 300
  # 시간이 지나면 모델이 대신 처리 (false면 그냥 큐에 남겨둠)
  human-fallback-to-model: true
  # 받아놓고 제출을 안 하거나 접속을 끊으면 이 시간 뒤에 회수합니다
  human-claim-seconds: 600
  # announce each mined task in chat
  broadcast: true

# rig anchor is written here by /lm rig

# ─── 월드에 실제로 짓는 것들 ──────────────────────────────────────────────
# 이 플러그인이 놓는 블록은 전부 원래 블록을 기억했다가 /lm clear 또는
# 서버 종료 시 되돌립니다. 플레이어가 지은 건물 위에는 절대 안 놓습니다
# (공기·풀·꽃 같은 자리에만 놓음).
build:
  # 에이전트 NPC 뒤에 신용점수 탑 (100점당 1층, 등급별 재질)
  towers: true
  # 채굴 리그 앞에 금광석 + 금괴가 쌓이는 상자
  mine: true
  # 일감 목록을 담은 책이 놓인 독서대(우클릭하면 읽을 수 있음)
  quest-lectern: true
  # 일감이 채워지면 불꽃놀이 + 종소리 + 2초짜리 레드스톤 신호
  celebrate: true
  # 마을에 광장·은행 건물·가로등 건축 (/lm clear 시 원상복구)
  town: true
  # 발전소·비콘·풀가동 레버 등 화려한 연출
  spectacle: true

# ─── 핸드셀 오피스 (/lm office) ───────────────────────────────────────────
# 오피스 = 역할별 전문 에이전트 한 층. 각 자리에 주민이 앉고, 바닥의 파란
# 선이 일의 흐름(after), 빨간 선이 반려(REVISE) 경로입니다.
#
# 공개 API에는 오피스 엔드포인트가 없습니다. 그래서 "누가 어느 자리에
# 앉는가"는 여기에 적고(핸드셀의 office_roster 출력을 그대로 옮기면 됩니다),
# 자리마다 뜨는 신용점수·작업 상태는 실제 피드에서 가져옵니다. agent 이름이
# 피드에 없으면 0을 만들어 보여주지 않고 "피드에 없음"이라고 적습니다.
#
# 적은 뒤: /lm reload → /lm office place <id> (서 있는 자리에 지어집니다)
#
# offices:
#   cloud-options-desk:
#     name: "Cloud Options Desk"
#     tagline: "세 벤더가 각자 문서를 읽고 → 아키텍트가 비교표를 씁니다"
#     budget-usd: 12
#     scope: "월 500만 요청 웹훅 리시버, p99 300ms"
#     source: "https://example.test/brief"      # 이 오피스가 공유하는 자료
#     roles:
#       - role: aws
#         title: "AWS read"
#         agent: "Worker Bot Alpha"             # /api/world/agents 의 에이전트 이름
#         price-usd: 1.71
#         mcp-tool: "aws___search_documentation"
#         mcp-server: "https://knowledge-mcp.global.api.aws"
#       - role: azure
#         title: "Azure read"
#         price-usd: 1.71
#       - role: architect
#         title: "Platform recommendation"
#         price-usd: 3.43
#         after: [aws, azure]                   # 이 자리로 들어오는 입력
#       - role: red-team
#         title: "Red team"
#         price-usd: 1.71
#         reviews: architect                    # REVISE면 그 자리로 되돌아감
#
# 세운 오피스의 위치는 아래 office-sites 에 자동으로 기록됩니다.
# office-sites: []

# ─── 화면 HUD (항상 표시) ─────────────────────────────────────────────────
hud:
  # 오른쪽 사이드바 실시간 순위판 (자막)
  scoreboard: true
  # 화면 하단 액션바 이벤트 티커
  ticker: true
  # 티커가 몇 초마다 다음 헤드라인으로 넘어갈지
  ticker-seconds: 3

# 인간 vs AI 대결 (/lm duel) — 한 라운드 제한시간(초)
duel-seconds: 20

# 마을 주민들이 실제 경제 이벤트에 반응해 걸어다니기 (은행 왕복 등)
village-life: true

# 풀가동 레버를 눌렀을 때 쇼 지속 시간(초)
spectacle-seconds: 30
